<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#100817">
  <meta name="description" content="Bem-vindo às configurações dos servidores do Discord na Yukina.">
  <link rel="icon" type="image/png" href="https://yukina-6uo.pages.dev/assets/yukina-bg.png">
  <link rel="apple-touch-icon" href="https://yukina-6uo.pages.dev/assets/yukina-bg.png">
  <meta property="og:site_name" content="Yukina">
  <meta property="og:title" content="Configurações dos servidores • Yukina">
  <meta property="og:description" content="Bem-vindo às configurações dos servidores do Discord.">
  <meta property="og:image" content="https://yukina-6uo.pages.dev/assets/yukina-bg.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://yukina-6uo.pages.dev/assets/yukina-bg.png">
  <title>Configurações dos Servidores • Yukina</title>
  <style>
    :root{color-scheme:dark;--bg:#0b0712;--panel:#171020;--line:#8edcff45;--ice:#a7d8f0;--lavender:#c8c4ff;--muted:#cbbdd8}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 12% 0%,#173d5b 0,transparent 38%),radial-gradient(ellipse at 90% 15%,#29244f 0,transparent 32%),var(--bg);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#f8f4ff}
    main{width:min(100%,760px);text-align:center;padding:clamp(28px,6vw,58px);border:1px solid var(--line);border-radius:28px;background:linear-gradient(145deg,#1b1528ee,#100b19f5);box-shadow:0 24px 80px #0008}
    .mark{width:clamp(100px,20vw,150px);height:clamp(100px,20vw,150px);object-fit:cover;border-radius:50%;border:2px solid #a7d8f080;box-shadow:0 0 40px #8edcff24}
    .eyebrow{margin:26px 0 10px;color:var(--ice);font-size:.78rem;letter-spacing:.2em;text-transform:uppercase}
    h1{margin:0;font-size:clamp(1.8rem,5vw,3rem);line-height:1.12;letter-spacing:-.04em}
    p{max-width:520px;margin:18px auto 0;color:var(--muted);font-size:1.05rem;line-height:1.75}
    .accent{color:var(--lavender)}
    .footer{margin-top:30px;font-size:.82rem;color:#9386a7}
  </style>
</head>
<body>
  <main>
    <img class="mark" src="https://yukina-6uo.pages.dev/assets/yukina-bg.png" alt="Yukina" onerror="this.style.display='none'">
    <div class="eyebrow">Yukina • Discord</div>
    <h1>Bem-vindo às <span class="accent">Configurações dos Servidores</span></h1>
    <p>Este é o espaço de configurações dos servidores do Discord. Em breve, novas opções estarão disponíveis por aqui.</p>
    <div class="footer">Feito com ❄️ pela Yukina</div>
  </main>
</body>
</html>
