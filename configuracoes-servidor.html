<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#100817">
  <meta name="description" content="Bem-vindo às configurações dos servidores do Discord na Yukina.">
  <link rel="icon" type="image/png" href="https://yukina-6uo.pages.dev/assets/yukina-bg.png">
  <link rel="apple-touch-icon" href="https://yukina-6uo.pages.dev/assets/yukina-bg.png">
  <meta property="og:site_name" content="Yukina">
  <meta property="og:title" content="Configurações dos servidores • Yukina">
  <meta property="og:description" content="Bem-vindo às configurações dos servidores do Discord.">
  <meta property="og:image" content="https://yukina-6uo.pages.dev/assets/yukina-bg.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://yukina-6uo.pages.dev/assets/yukina-bg.png">
  <title>Configurações dos Servidores • Yukina</title>
  <style>
    :root{color-scheme:dark;--bg:#0b0712;--ice:#a7d8f0;--lavender:#c8c4ff;--muted:#cbbdd8}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:28px;background:radial-gradient(ellipse at 12% 0%,#173d5b 0,transparent 38%),radial-gradient(ellipse at 90% 15%,#29244f 0,transparent 32%),var(--bg);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#f8f4ff}
    .server-menu{position:fixed;top:18px;left:18px;z-index:10}
    .menu-toggle{width:44px;height:44px;display:grid;place-items:center;border:1px solid #8edcff55;border-radius:13px;background:#171020cc;color:#f8f4ff;font-size:24px;cursor:pointer;backdrop-filter:blur(12px)}
    .menu-panel{position:absolute;top:54px;left:0;width:270px;padding:12px;border:1px solid #8edcff55;border-radius:16px;background:#171020f5;box-shadow:0 16px 44px #0008;backdrop-filter:blur(16px)}
    .server-current{display:flex;align-items:center;gap:12px;padding:4px 4px 12px}
    .server-picker{width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 12px;border:1px solid #8edcff35;border-radius:12px;background:#0b0712;color:#f8f4ff;text-align:left;cursor:pointer}
    .picker-label{font-size:.82rem;color:var(--muted)}
    .picker-arrow{transition:transform .18s ease}
    .server-picker[aria-expanded="true"] .picker-arrow{transform:rotate(180deg)}
    .server-options{margin-top:6px;padding:5px;border:1px solid #8edcff30;border-radius:12px;background:#0b0712;max-height:260px;overflow:auto}
    .server-options[hidden]{display:none}
    .server-option{display:flex;width:100%;align-items:center;gap:10px;padding:9px;border:0;border-radius:9px;background:transparent;color:#f8f4ff;text-align:left;cursor:pointer}
    .server-option:hover,.server-option[aria-current="true"]{background:#a7d8f01a}
    .server-option img{width:34px;height:34px;border-radius:10px;object-fit:cover}
    .server-option span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .server-status{padding:8px 5px;color:var(--muted);font-size:.82rem;line-height:1.5}
    .menu-panel[hidden]{display:none}
    .server-avatar{width:56px;height:56px;flex:0 0 56px;object-fit:cover;border-radius:14px}
    .server-name{font-weight:700;color:#f8f4ff}
    .server-subtitle{margin-top:4px;color:var(--muted);font-size:.8rem}
    main{width:min(100%,780px);text-align:center}
    .mark{width:clamp(84px,18vw,132px);height:clamp(84px,18vw,132px);object-fit:cover;border-radius:50%;border:2px solid #a7d8f080;box-shadow:0 0 36px #8edcff24}
    .eyebrow{margin:25px 0 12px;color:var(--ice);font-size:.78rem;letter-spacing:.2em;text-transform:uppercase}
    h1{margin:0;font-size:clamp(1.9rem,5vw,3.2rem);line-height:1.15;letter-spacing:-.04em}
    p{max-width:570px;margin:20px auto 0;color:var(--muted);font-size:1.05rem;line-height:1.8}
    .accent{color:var(--lavender)}
    .footer{margin-top:28px;font-size:.82rem;color:#9386a7}
  </style>
</head>
<body>
  <main>
    <img class="mark" src="https://yukina-6uo.pages.dev/assets/yukina-bg.png" alt="Yukina" onerror="this.style.display='none'">
    <div class="eyebrow">Yukina • Discord</div>
    <h1>Bem-vindo às <span class="accent">Configurações dos Servidores</span></h1>
    <p>Este é o espaço de configurações dos servidores do Discord. Em breve, novas opções estarão disponíveis por aqui.</p>
    <div class="footer">Feito com ❄️ pela Yukina</div>
  </main>
  <script>
    (() => {
      const toggle = document.getElementById('menuToggle');
      const menu = document.getElementById('serverMenu');
      toggle.addEventListener('click', () => {
        const opening = menu.hidden;
        menu.hidden = !opening;
        toggle.setAttribute('aria-expanded', String(opening));
        toggle.setAttribute('aria-label', opening ? 'Fechar menu' : 'Abrir menu');
      });
      document.addEventListener('click', (event) => {
        if (!event.target.closest('.server-menu')) {
          menu.hidden = true;
          toggle.setAttribute('aria-expanded', 'false');
          toggle.setAttribute('aria-label', 'Abrir menu');
        }
      });
    })();
  </script>
</body>
</html>
