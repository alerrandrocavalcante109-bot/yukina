<body style="margin:0;min-height:100vh;background:#080510;overflow:hidden">
<main aria-label="Tela inicial da Yukina" style="position:relative;width:100vw;height:100vh;margin:0;padding:0">
  <img src="./assets/yukina-bg.png" alt="" aria-hidden="true" style="position:absolute;inset:0;display:block;width:100%;height:100%;object-fit:cover;object-position:center center">
  <section aria-label="Apresentação da Yukina" style="position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;pointer-events:none;font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <h1 style="margin:0;font-size:clamp(52px,11vw,112px);font-weight:900;letter-spacing:clamp(1px,.5vw,5px);line-height:1.05;color:#ff9ed8;background:linear-gradient(100deg,#ffb0df 0%,#f06fc8 55%,#b68aff 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 3px 22px rgba(232,92,186,.55))">Yumina</h1>
    <p style="max-width:650px;margin:18px 0 0;color:#fff0fb;font-size:clamp(22px,3.2vw,32px);font-weight:600;line-height:1.55;letter-spacing:.45px;text-shadow:0 2px 14px rgba(10,4,25,.95),0 0 22px rgba(181,103,224,.45)">Onde a neve encontra a magia, uma nova história começa.</p>
    <p style="max-width:760px;margin:12px 0 0;color:#f3d9ff;font-size:clamp(16px,2vw,22px);font-weight:500;line-height:1.6;letter-spacing:.25px;text-shadow:0 2px 12px rgba(10,4,25,.95),0 0 18px rgba(181,103,224,.38)">Explore um universo de possibilidades, feito para transformar cada momento em algo especial.</p>
  </section>
  <div style="position:fixed;top:20px;left:20px;z-index:10;font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <div style="display:flex;align-items:center;gap:13px">
    <button id="yukina-menu-toggle" type="button" aria-label="Abrir menu" aria-expanded="false" aria-controls="yukina-menu" style="display:flex;align-items:center;justify-content:center;gap:9px;width:54px;height:54px;border:1px solid rgba(255,255,255,.42);border-radius:17px;color:white;background:linear-gradient(135deg,#ff70b7 0%,#e85cba 55%,#9462d9 100%);box-shadow:0 8px 28px rgba(220,77,174,.32);cursor:pointer;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);transition:transform .2s ease,box-shadow .2s ease">
      <span aria-hidden="true" style="display:flex;flex-direction:column;gap:5px;width:22px">
        <span style="display:block;height:2px;width:22px;border-radius:2px;background:#fff"></span>
        <span style="display:block;height:2px;width:16px;border-radius:2px;background:#fff"></span>
        <span style="display:block;height:2px;width:22px;border-radius:2px;background:#fff"></span>
      </span>
    </button>
    <a href="./index.html" aria-label="Yukina — início" style="font-size:clamp(23px,3vw,32px);font-weight:850;letter-spacing:.4px;line-height:1;text-decoration:none;color:#ff9ed8;background:linear-gradient(100deg,#ff9ed8 0%,#f06fc8 58%,#b68aff 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 2px 12px rgba(232,92,186,.4))">Yukina</a>
    </div>
    <nav id="yukina-menu" aria-label="Menu principal" hidden style="position:absolute;top:65px;left:0;width:220px;padding:10px;border:1px solid rgba(255,180,226,.35);border-radius:18px;background:linear-gradient(145deg,rgba(46,18,47,.96),rgba(28,20,54,.96));box-shadow:0 16px 45px rgba(0,0,0,.42),0 0 25px rgba(231,91,183,.13);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)">
      <div style="padding:10px 12px 12px;color:#ffb4df;font-size:11px;font-weight:800;letter-spacing:2px;text-transform:uppercase">Yukina</div>
      <a href="./index.html" style="display:block;padding:12px;border-radius:11px;color:#fff;text-decoration:none;font-size:14px;font-weight:600;background:rgba(255,112,183,.12)">⌂　Início</a>
      <a href="./configuracoes.html?modo=interface" style="display:block;margin-top:4px;padding:12px;border-radius:11px;color:#f8eaf7;text-decoration:none;font-size:14px;font-weight:500">⚙　Painel de configurações</a>
      <a href="./login.html" style="display:block;margin-top:4px;padding:12px;border-radius:11px;color:#f8eaf7;text-decoration:none;font-size:14px;font-weight:500">❄　Acessar Yukina</a>
    </nav>
  </div>
</main>
<script>
(() => {
  const toggle = document.getElementById('yukina-menu-toggle');
  const menu = document.getElementById('yukina-menu');
  if (!toggle || !menu) return;
  toggle.addEventListener('click', () => {
    const opening = menu.hidden;
    menu.hidden = !opening;
    toggle.setAttribute('aria-expanded', String(opening));
    toggle.setAttribute('aria-label', opening ? 'Fechar menu' : 'Abrir menu');
  });
  document.addEventListener('click', (event) => {
    if (!menu.hidden && !menu.parentElement.contains(event.target)) {
      menu.hidden = true;
      toggle.setAttribute('aria-expanded', 'false');
      toggle.setAttribute('aria-label', 'Abrir menu');
    }
  });
  document.addEventListener('keydown', (event) => {
    if (event.key === 'Escape') {
      menu.hidden = true;
      toggle.setAttribute('aria-expanded', 'false');
      toggle.setAttribute('aria-label', 'Abrir menu');
    }
  });
  menu.querySelectorAll('a').forEach((link) => {
    link.addEventListener('mouseenter', () => { link.style.background = 'linear-gradient(90deg,rgba(255,112,183,.22),rgba(148,98,217,.18))'; });
    link.addEventListener('mouseleave', () => { link.style.background = ''; });
  });
})();
</script>
</body>
