<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Diagnóstico da API • Yukina</title>
<style>
body{margin:0;padding:24px;background:#10091d;color:#fff;font:16px system-ui;min-height:100vh}
main{max-width:650px;margin:8vh auto;padding:24px;border:1px solid #8d668c;border-radius:18px;background:#21132e}
h1{font-size:24px}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#120b1b;padding:16px;border-radius:12px;color:#ffe4f3}
</style>
</head>
<body><main>
<h1>Diagnóstico da API da Yukina</h1>
<p>Este teste verifica a comunicação do site com o Render pelo navegador.</p>
<pre id="out">Testando...</pre>
<script>
(async()=>{
 const out=document.getElementById("out");
 const url="https://yukina-s1lz.onrender.com/api/config/turnstile";
 const lines=["Origem do site: "+location.origin,"Destino: "+url,""];
 try{
  const response=await fetch(url,{method:"GET",cache:"no-store"});
  lines.push("Fetch: OK","HTTP: "+response.status,"Access-Control-Allow-Origin: "+(response.headers.get("access-control-allow-origin")||"(não exposto)"));
  const data=await response.json();
  lines.push("Resposta: "+JSON.stringify(data));
 }catch(error){
  lines.push("Fetch: FALHOU","Tipo: "+(error.name||"Error"),"Mensagem: "+(error.message||String(error)),"",
  "Isso normalmente indica bloqueio CORS, falha de rede ou serviço indisponível.");
 }
 out.textContent=lines.join("\n");
})();
</script>
</main></body></html>
