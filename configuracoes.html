<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#100817"><title>Selecionar servidor • Yukina</title><script src="./tema.js" defer></script>
<style>
:root{color-scheme:dark;--line:#c084fc55;--pink:#ff8dcc;--purple:#b79aff}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 10% 0%,#57247b 0,transparent 36%),radial-gradient(ellipse at 90% 15%,#641b52 0,transparent 30%),#0b0712;font-family:Inter,system-ui,sans-serif;color:#fff}.wrap{width:min(760px,calc(100% - 28px));margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:20px 0;border-bottom:1px solid var(--line)}a{color:#e9d5ff;text-decoration:none}.brand{font-weight:900;letter-spacing:.12em}.pill,button,select{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:#211431;color:white;font:inherit}.hero{padding:40px 0 20px}.eyebrow{color:#e9b8ff;text-transform:uppercase;letter-spacing:.16em;font-size:.75rem;font-weight:800}h1{font-size:clamp(2rem,7vw,3.4rem);letter-spacing:-.05em;margin:9px 0}p{color:#d9cce6;line-height:1.65}.panel{background:#130c20;border:1px solid var(--line);border-radius:20px;padding:22px;margin:16px 0;box-shadow:0 18px 50px #0003}.field{display:grid;gap:10px;margin:16px 0}select{width:100%;background:#211431;cursor:pointer}.btn{cursor:pointer;background:linear-gradient(115deg,var(--pink),var(--purple));color:#24102e;font-weight:850;border:0}.status{font-size:.9rem;color:#e9d5ff;min-height:24px}.muted{font-size:.88rem;color:#cbbdd8}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}@media(max-width:600px){.panel{padding:16px}.top{align-items:flex-start}}
</style></head><body><div class="wrap"><header class="top"><a class="brand" href="./index.html">✦ YUKINA</a><a class="pill" href="./index.html">← Página inicial</a></header>
<section class="hero"><div class="eyebrow">Painel administrativo</div><h1>Selecionar servidor</h1><p>Escolha um servidor para abrir a página de configurações exclusiva dele.</p></section>
<section class="panel"><div class="field"><label for="guildSelect">Seus servidores com permissão de gerenciamento</label><select id="guildSelect"><option value="">Carregando servidores…</option></select></div><div class="row"><button class="btn" id="open" type="button" disabled>Abrir configurações</button><button id="reload" type="button">Atualizar lista</button><a class="pill" href="./login.html">Entrar / atualizar permissões</a></div><p id="status" class="status" role="status" aria-live="polite"></p><p class="muted">A lista mostra somente servidores em que sua conta tem permissão de administrador ou “Gerenciar servidor”.</p></section></div>
<script>(()=>{const select=document.getElementById("guildSelect"),status=document.getElementById("status"),open=document.getElementById("open");let guilds=[];const ADMIN=0x8n,MANAGE_GUILD=0x20n;function token(){try{return sessionStorage.getItem("yukina_discord_token")}catch(_){return null}}function canManage(g){try{const p=BigInt(g.permissions||"0");return(p&ADMIN)!==0n||(p&MANAGE_GUILD)!==0n}catch(_){return false}}async function load(){open.disabled=true;const access=token();if(!access){select.innerHTML='<option value="">Entre com o Discord primeiro</option>';status.textContent="Entre pelo Discord para carregar seus servidores.";return}status.textContent="Carregando servidores…";select.innerHTML='<option value="">Carregando…</option>';try{const res=await fetch("https://discord.com/api/users/@me/guilds",{headers:{Authorization:"Bearer "+access}});if(!res.ok)throw new Error(res.status===401||res.status===403?"Autorização expirada ou sem permissão. Entre novamente pelo Discord.":"Falha ao consultar o Discord (HTTP "+res.status+").");guilds=(await res.json()).filter(canManage);select.innerHTML='<option value="">Selecione um servidor…</option>';guilds.forEach(g=>{const o=document.createElement("option");o.value=g.id;o.textContent=g.name;select.appendChild(o)});status.textContent=guilds.length?guilds.length+" servidor(es) encontrado(s).":"Nenhum servidor com permissão necessária foi encontrado."}catch(e){select.innerHTML='<option value="">Não foi possível carregar</option>';status.textContent=e.message}}select.addEventListener("change",()=>open.disabled=!guilds.some(g=>g.id===select.value));function go(){const g=guilds.find(x=>x.id===select.value);if(!g)return;location.href="./configuracoes-servidor.html?guild="+encodeURIComponent(g.id)+"&name="+encodeURIComponent(g.name)}open.addEventListener("click",go);select.addEventListener("dblclick",go);document.getElementById("reload").addEventListener("click",load);load()})();</script></body></html>
