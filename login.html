<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#100b1d">
  <title>Entrar com Discord • Yukina</title>
  <style>
:root{color-scheme:dark;--bg:#080d19;--panel:rgba(15,25,43,.82);--line:#9bdcff35;--ice:#a7d8f0;--lav:#c8c4ff;--muted:#a9bad0}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;overflow:hidden;position:relative;background:radial-gradient(ellipse at 12% 12%,#1d4263 0,transparent 38%),radial-gradient(ellipse at 90% 90%,#29214f 0,transparent 38%),linear-gradient(145deg,#080d19,#0b1020 55%,#11162a);font-family:Inter,ui-sans-serif,system-ui,-apple-system,sans-serif;color:#f5f8ff}
body:before,body:after{content:"";position:fixed;pointer-events:none;border:1px solid #b6e7ff18;border-radius:50%;width:48vw;height:48vw;min-width:380px;min-height:380px;right:-20vw;top:-22vw;box-shadow:0 0 90px #80cfff08,inset 0 0 90px #80cfff05}
body:after{width:34vw;height:34vw;min-width:280px;min-height:280px;right:auto;left:-15vw;top:auto;bottom:-18vw}
.card{position:relative;width:min(100%,470px);padding:clamp(26px,6vw,42px);border:1px solid var(--line);border-radius:28px;background:linear-gradient(150deg,#17243be8,#10182be8 60%,#15162ee8);box-shadow:0 30px 100px #0008,0 0 55px #8edbff0a;backdrop-filter:blur(22px);text-align:center}
.brandline{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:28px;color:#d6f1ff;font-size:12px;font-weight:850;letter-spacing:.22em}
.logo{width:76px;height:76px;margin:0 auto 20px;border-radius:26px;display:grid;place-items:center;background:linear-gradient(145deg,#c4efff,#a8baff 65%,#d7c4ff);color:#15233a;font-size:34px;font-weight:950;box-shadow:0 12px 38px #7dd3fc26;border:1px solid #fff9}
.eyebrow{margin:0 0 9px;color:var(--ice);font-size:11px;font-weight:850;letter-spacing:.19em;text-transform:uppercase}
h1{margin:0;font-size:clamp(27px,7vw,35px);letter-spacing:-1.1px;line-height:1.12}p{color:var(--muted);line-height:1.75;font-size:14px;margin:14px 0 24px}
.login{width:100%;border:1px solid #c8f0ff70;border-radius:15px;padding:15px 18px;background:linear-gradient(105deg,#b8eaff,#b9c8ff 65%,#d6c8ff);color:#111d32;font-weight:850;font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:11px;transition:transform .2s,filter .2s,box-shadow .2s;box-shadow:0 9px 28px #7dd3fc17}
.login:hover{filter:brightness(1.06);transform:translateY(-2px);box-shadow:0 14px 34px #7dd3fc25}.login:disabled{opacity:.62;cursor:wait;transform:none}
.status{min-height:24px;margin-top:17px;font-size:13px;color:#cdeeff;line-height:1.5}.back{display:inline-flex;align-items:center;gap:7px;margin-top:15px;color:#c4e9ff;text-decoration:none;font-size:13px}.back:hover{text-decoration:underline}
.note{border-top:1px solid #d7eaff16;margin-top:25px;padding-top:17px;font-size:11px;line-height:1.65;color:#8194ae}.spark{color:#c9c9ff;font-size:14px}
@media(prefers-reduced-motion:no-preference){.card{animation:rise .55s ease-out both}@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}}
</style>
<script src="./tema.js" defer></script>
</head>
<body>
  <main class="card">
    <div class="brandline"><span class="spark">✦</span> YUKINA <span class="spark">✦</span></div><div class="logo">雪</div>
    <div class="eyebrow">Seu espaço, suas regras</div><h1>Bem-vindo à Yukina</h1>
    <p>Conecte seu Discord para acessar o painel, escolher seus servidores e personalizar a experiência da Yukina.</p>
    <button class="login" id="loginButton" type="button"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M19.73 5.1A18.4 18.4 0 0 0 15.2 3.7l-.57 1.16a16.8 16.8 0 0 0-5.26 0L8.8 3.7A18.4 18.4 0 0 0 4.27 5.1C1.4 9.35.62 13.5 1.01 17.6a18.5 18.5 0 0 0 5.56 2.8l1.2-1.95c-.66-.25-1.28-.57-1.87-.94l.46-.36c3.6 1.68 7.5 1.68 11.06 0l.47.36c-.6.37-1.22.69-1.88.94l1.2 1.95a18.4 18.4 0 0 0 5.56-2.8c.46-4.75-.78-8.86-3.04-12.5ZM8.5 14.95c-1.08 0-1.96-.99-1.96-2.2s.86-2.2 1.96-2.2 1.98.99 1.96 2.2c0 1.21-.86 2.2-1.96 2.2Zm7 0c-1.08 0-1.96-.99-1.96-2.2s.86-2.2 1.96-2.2 1.98.99 1.96 2.2c0 1.21-.86 2.2-1.96 2.2Z"/></svg> Entrar com Discord</button>
    <div class="status" id="status" role="status" aria-live="polite"></div>
    <a class="back" href="./index.html">← Voltar para a página inicial</a>
    <div class="note">AUTENTICAÇÃO OFICIAL DO DISCORD · A Yukina nunca recebe sua senha.</div>
  </main>
<script>
(() => {
  // Configure o Client ID público no portal de desenvolvedores do Discord.
  const CLIENT_ID = "1561485997277970514";
  const REDIRECT_URI = "https://yukina-6uo.pages.dev/login.html";
  const status = document.getElementById("status");
  const button = document.getElementById("loginButton");
  const params = new URLSearchParams(window.location.search);
  const requestedReturn = params.get("return") || "./index.html";
  function safeReturnTarget(value) {
    try { const url = new URL(value, window.location.href); if (url.origin !== window.location.origin || value.startsWith("//") || (!value.startsWith("./") && !value.startsWith("/"))) return "./index.html"; return url.pathname + url.search; } catch (_) { return "./index.html"; }
  }
  const random = (length=64) => {
    const bytes = crypto.getRandomValues(new Uint8Array(length));
    return Array.from(bytes, b => String.fromCharCode(b)).join("");
  };
  const base64url = bytes => btoa(String.fromCharCode(...new Uint8Array(bytes))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
  const sha256 = async text => crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));

  async function startLogin() {
    if (!CLIENT_ID || CLIENT_ID.includes("COLOQUE_SEU")) {
      status.textContent = "Falta configurar o Client ID do aplicativo Discord.";
      return;
    }
    sessionStorage.setItem("yukina_login_return", safeReturnTarget(requestedReturn));
    button.disabled = true;
    status.textContent = "Preparando uma conexão segura com o Discord…";
    const verifier = base64url(new TextEncoder().encode(random(64)));
    const challenge = base64url(await sha256(verifier));
    const state = base64url(new TextEncoder().encode(random(32)));
    sessionStorage.setItem("yukina_oauth_verifier", verifier);
    sessionStorage.setItem("yukina_oauth_state", state);
    const url = new URL("https://discord.com/oauth2/authorize");
    url.search = new URLSearchParams({
      client_id: CLIENT_ID,
      response_type: "code",
      redirect_uri: REDIRECT_URI,
      scope: "identify guilds",
      code_challenge: challenge,
      code_challenge_method: "S256",
      state
    }).toString();
    window.location.assign(url.toString());
  }

  async function finishLogin() {
    if (params.has("error")) {
      status.textContent = "Login cancelado. Você pode tentar novamente.";
      history.replaceState({}, "", REDIRECT_URI);
      return;
    }
    const code = params.get("code");
    if (!code) return;
    const expectedState = sessionStorage.getItem("yukina_oauth_state");
    const returnedState = params.get("state");
    const verifier = sessionStorage.getItem("yukina_oauth_verifier");
    history.replaceState({}, "", REDIRECT_URI);
    if (!expectedState || !returnedState || returnedState !== expectedState || !verifier) {
      status.textContent = "Não foi possível validar esta sessão. Tente entrar novamente.";
      return;
    }
    if (CLIENT_ID.includes("COLOQUE_SEU")) {
      status.textContent = "Falta configurar o Client ID do aplicativo Discord.";
      return;
    }
    button.disabled = true;
    status.textContent = "Validando sua conta…";
    try {
      const tokenResponse = await fetch("https://discord.com/api/oauth2/token", {
        method: "POST",
        headers: {"Content-Type":"application/x-www-form-urlencoded"},
        body: new URLSearchParams({
          client_id: CLIENT_ID,
          grant_type: "authorization_code",
          code,
          redirect_uri: REDIRECT_URI,
          code_verifier: verifier
        })
      });
      const tokenData = await tokenResponse.json();
      if (!tokenResponse.ok || !tokenData.access_token) throw new Error("O Discord não autorizou o acesso. Confira o Client ID e a URL de redirecionamento.");
      const userResponse = await fetch("https://discord.com/api/users/@me", {
        headers: {Authorization: "Bearer " + tokenData.access_token}
      });
      const user = await userResponse.json();
      if (!userResponse.ok || !user.id) throw new Error("Não foi possível carregar seu perfil do Discord.");
      sessionStorage.setItem("yukina_discord_user", JSON.stringify({
        id:user.id, username:user.username, global_name:user.global_name || user.username,
        avatar:user.avatar ? "https://cdn.discordapp.com/avatars/" + user.id + "/" + user.avatar + ".png?size=128" : null
      }));
      sessionStorage.setItem("yukina_discord_token", tokenData.access_token);
      sessionStorage.removeItem("yukina_oauth_verifier");
      sessionStorage.removeItem("yukina_oauth_state");
      status.textContent = "Login concluído! Voltando para a página inicial…";
      const returnTo = safeReturnTarget(sessionStorage.getItem("yukina_login_return") || "./index.html");
      sessionStorage.removeItem("yukina_login_return");
      window.location.replace(returnTo + (returnTo.includes("?") ? "&" : "?") + "login=success");
    } catch (error) {
      status.textContent = error.message || "Erro ao entrar. Tente novamente.";
      button.disabled = false;
    }
  }
  button.addEventListener("click", startLogin);
  finishLogin();
})();
</script>
</body>
</html>
