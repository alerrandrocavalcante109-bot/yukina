<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#100b1d">
  <title>Entrar com Discord • Yukina</title>
  <style>
    :root{color-scheme:dark;--bg:#100b1d;--panel:rgba(30,20,47,.88);--purple:#a855f7;--pink:#ec4899;--muted:#b9aecb}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 15% 15%,#47216c 0,transparent 38%),radial-gradient(ellipse at 85% 85%,#4a174c 0,transparent 35%),var(--bg);font-family:Inter,ui-sans-serif,system-ui,-apple-system,sans-serif;color:#fff}
    .card{width:min(100%,430px);padding:34px;border:1px solid #ffffff20;border-radius:24px;background:var(--panel);box-shadow:0 24px 90px #0007;backdrop-filter:blur(18px);text-align:center}
    .logo{width:76px;height:76px;margin:0 auto 18px;border-radius:24px;display:grid;place-items:center;background:linear-gradient(135deg,var(--purple),var(--pink));font-size:35px;font-weight:800;box-shadow:0 10px 34px #a855f755}
    h1{margin:0;font-size:30px;letter-spacing:-.8px}p{color:var(--muted);line-height:1.65;font-size:14px}
    .login{width:100%;border:0;border-radius:13px;padding:15px 18px;margin-top:14px;background:#5865f2;color:#fff;font-weight:750;font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;transition:transform .18s,filter .18s}
    .login:hover{filter:brightness(1.1);transform:translateY(-1px)}.login:disabled{opacity:.6;cursor:wait;transform:none}
    .status{min-height:24px;margin-top:16px;font-size:13px;color:#e9d5ff}.back{display:inline-block;margin-top:18px;color:#d8b4fe;text-decoration:none;font-size:13px}.back:hover{text-decoration:underline}
    .note{border-top:1px solid #ffffff18;margin-top:24px;padding-top:16px;font-size:11px;color:#9f93b2}
  </style>
</head>
<body>
  <main class="card">
    <div class="logo">Y</div>
    <h1>Bem-vindo à Yukina</h1>
    <p>Entre com sua conta do Discord para acessar seu perfil e as configurações da Yukina.</p>
    <button class="login" id="loginButton" type="button"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M19.73 5.1A18.4 18.4 0 0 0 15.2 3.7l-.57 1.16a16.8 16.8 0 0 0-5.26 0L8.8 3.7A18.4 18.4 0 0 0 4.27 5.1C1.4 9.35.62 13.5 1.01 17.6a18.5 18.5 0 0 0 5.56 2.8l1.2-1.95c-.66-.25-1.28-.57-1.87-.94l.46-.36c3.6 1.68 7.5 1.68 11.06 0l.47.36c-.6.37-1.22.69-1.88.94l1.2 1.95a18.4 18.4 0 0 0 5.56-2.8c.46-4.75-.78-8.86-3.04-12.5ZM8.5 14.95c-1.08 0-1.96-.99-1.96-2.2s.86-2.2 1.96-2.2 1.98.99 1.96 2.2c0 1.21-.86 2.2-1.96 2.2Zm7 0c-1.08 0-1.96-.99-1.96-2.2s.86-2.2 1.96-2.2 1.98.99 1.96 2.2c0 1.21-.86 2.2-1.96 2.2Z"/></svg> Entrar com Discord</button>
    <div class="status" id="status" role="status" aria-live="polite"></div>
    <a class="back" href="./index.html">← Voltar para a página inicial</a>
    <div class="note">A autenticação é feita pelo Discord. A Yukina não recebe sua senha.</div>
  </main>
<script>
(() => {
  // Configure o Client ID público no portal de desenvolvedores do Discord.
  const CLIENT_ID = "1537936570869350400";
  const REDIRECT_URI = new URL("./login.html", window.location.href).href;
  const status = document.getElementById("status");
  const button = document.getElementById("loginButton");
  const params = new URLSearchParams(window.location.search);
  const random = (length=64) => {
    const bytes = crypto.getRandomValues(new Uint8Array(length));
    return Array.from(bytes, b => String.fromCharCode(b)).join("");
  };
  const base64url = bytes => btoa(String.fromCharCode(...new Uint8Array(bytes))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
  const sha256 = async text => crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));

  async function startLogin() {
    if (!CLIENT_ID || CLIENT_ID.includes("COLOQUE_SEU")) {
      status.textContent = "Falta configurar o Client ID do aplicativo Discord.";
      return;
    }
    button.disabled = true;
    status.textContent = "Redirecionando para o Discord…";
    const verifier = base64url(new TextEncoder().encode(random(64)));
    const challenge = base64url(await sha256(verifier));
    const state = base64url(new TextEncoder().encode(random(32)));
    sessionStorage.setItem("yukina_oauth_verifier", verifier);
    sessionStorage.setItem("yukina_oauth_state", state);
    const url = new URL("https://discord.com/oauth2/authorize");
    url.search = new URLSearchParams({
      client_id: CLIENT_ID,
      response_type: "code",
      redirect_uri: REDIRECT_URI,
      scope: "identify",
      code_challenge: challenge,
      code_challenge_method: "S256",
      state
    }).toString();
    window.location.assign(url.toString());
  }

  async function finishLogin() {
    if (params.has("error")) {
      status.textContent = "Login cancelado. Você pode tentar novamente.";
      history.replaceState({}, "", REDIRECT_URI);
      return;
    }
    const code = params.get("code");
    if (!code) return;
    const expectedState = sessionStorage.getItem("yukina_oauth_state");
    const returnedState = params.get("state");
    const verifier = sessionStorage.getItem("yukina_oauth_verifier");
    history.replaceState({}, "", REDIRECT_URI);
    if (!expectedState || !returnedState || returnedState !== expectedState || !verifier) {
      status.textContent = "Não foi possível validar esta sessão. Tente entrar novamente.";
      return;
    }
    if (CLIENT_ID.includes("COLOQUE_SEU")) {
      status.textContent = "Falta configurar o Client ID do aplicativo Discord.";
      return;
    }
    button.disabled = true;
    status.textContent = "Validando sua conta…";
    try {
      const tokenResponse = await fetch("https://discord.com/api/oauth2/token", {
        method: "POST",
        headers: {"Content-Type":"application/x-www-form-urlencoded"},
        body: new URLSearchParams({
          client_id: CLIENT_ID,
          grant_type: "authorization_code",
          code,
          redirect_uri: REDIRECT_URI,
          code_verifier: verifier
        })
      });
      const tokenData = await tokenResponse.json();
      if (!tokenResponse.ok || !tokenData.access_token) throw new Error("O Discord não autorizou o acesso. Confira o Client ID e a URL de redirecionamento.");
      const userResponse = await fetch("https://discord.com/api/users/@me", {
        headers: {Authorization: "Bearer " + tokenData.access_token}
      });
      const user = await userResponse.json();
      if (!userResponse.ok || !user.id) throw new Error("Não foi possível carregar seu perfil do Discord.");
      sessionStorage.setItem("yukina_discord_user", JSON.stringify({
        id:user.id, username:user.username, global_name:user.global_name || user.username,
        avatar:user.avatar ? "https://cdn.discordapp.com/avatars/" + user.id + "/" + user.avatar + ".png?size=128" : null
      }));
      sessionStorage.setItem("yukina_discord_token", tokenData.access_token);
      sessionStorage.removeItem("yukina_oauth_verifier");
      sessionStorage.removeItem("yukina_oauth_state");
      status.textContent = "Login concluído! Voltando para a página inicial…";
      window.location.replace("./index.html?login=success");
    } catch (error) {
      status.textContent = error.message || "Erro ao entrar. Tente novamente.";
      button.disabled = false;
    }
  }
  button.addEventListener("click", startLogin);
  finishLogin();
})();
</script>
</body>
</html>
