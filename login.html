<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#10091d">
<link rel="icon" href="./assets/yukina-bg.png">
<title>Entrar com Discord • Yukina</title>
<style>
:root{color-scheme:dark;--bg:#0b0712;--panel:#171020;--ice:#a7d8f0;--pink:#e85cba;--muted:#c5bbd2}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 15% 15%,#39205a 0,transparent 40%),radial-gradient(ellipse at 85% 85%,#34204b 0,transparent 38%),var(--bg);font:16px system-ui,-apple-system,sans-serif;color:#f8f5ff}
.card{width:min(100%,440px);padding:34px;border:1px solid #a7d8f044;border-radius:24px;background:var(--panel);box-shadow:0 24px 90px #0008;text-align:center}
.logo{width:76px;height:76px;object-fit:cover;margin:0 auto 18px;border-radius:22px;display:block;box-shadow:0 8px 30px #0005}
h1{margin:0;font-size:29px;letter-spacing:-.6px}p{color:var(--muted);line-height:1.65;font-size:14px}
.login{width:100%;border:0;border-radius:13px;padding:15px 18px;margin-top:14px;background:#5865f2;color:#fff;font-weight:750;font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px}
.login:hover{filter:brightness(1.1)}.login:disabled{opacity:.65;cursor:wait}
.status{min-height:24px;margin-top:16px;font-size:13px;color:#dff5ff;overflow-wrap:anywhere}.back{display:inline-block;margin-top:18px;color:var(--ice);text-decoration:none;font-size:13px}.back:hover{text-decoration:underline}
.note{border-top:1px solid #ffffff18;margin-top:24px;padding-top:16px;font-size:11px;color:#9f93b2}
</style>
</head>
<body>
<main class="card">
<img class="logo" src="./assets/yukina-bg.png" alt="Yukina" onerror="this.style.display='none'">
<h1>Bem-vindo à Yukina</h1>
<p>Entre com sua conta do Discord para acessar os servidores que você pode gerenciar e configurar os sistemas da Yukina.</p>
<button class="login" id="loginButton" type="button"><span aria-hidden="true">◈</span> Entrar com Discord</button>
<div class="status" id="status" role="status" aria-live="polite"></div>
<a class="back" href="./index.html">← Voltar para a página inicial</a>
<div class="note">A autenticação é feita pelo Discord. Nunca informe sua senha fora do site oficial do Discord.</div>
</main>
<script src="./api-config.js"></script>
<script>
(() => {
  const CLIENT_ID = "1561485997277970514";
  const API_BASE = (window.YUKINA_API_URL || "https://yukina-jspa.onrender.com").replace(/\/$/, "");
  const REDIRECT_URI = "https://yukina-6uo.pages.dev/login.html";
  const status = document.getElementById("status");
  const button = document.getElementById("loginButton");
  const params = new URLSearchParams(location.search);
  const randomBytes = (length) => crypto.getRandomValues(new Uint8Array(length));
  const base64url = bytes => btoa(String.fromCharCode(...new Uint8Array(bytes))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
  const sha256 = async value => crypto.subtle.digest("SHA-256",new TextEncoder().encode(value));
  function cleanUrl(){history.replaceState({}, "", REDIRECT_URI);}
  async function startLogin(){
    button.disabled=true;status.textContent="Preparando login seguro…";
    try{
      const verifier=base64url(randomBytes(64));
      const state=base64url(randomBytes(32));
      const challenge=base64url(await sha256(verifier));
      sessionStorage.setItem("yukina_oauth_verifier",verifier);
      sessionStorage.setItem("yukina_oauth_state",state);
      const url=new URL("https://discord.com/oauth2/authorize");
      url.search=new URLSearchParams({
        client_id:CLIENT_ID,response_type:"code",redirect_uri:REDIRECT_URI,
        scope:"identify guilds",code_challenge:challenge,code_challenge_method:"S256",state
      }).toString();
      status.textContent="Redirecionando para o Discord…";
      location.assign(url.toString());
    }catch(e){status.textContent="Não foi possível iniciar o login. Verifique se o navegador permite acesso seguro.";button.disabled=false;}
  }
  async function finishLogin(){
    if(params.has("error")){
      cleanUrl();sessionStorage.removeItem("yukina_oauth_verifier");sessionStorage.removeItem("yukina_oauth_state");
      status.textContent="Login cancelado ou não autorizado. Você pode tentar novamente.";return;
    }
    const code=params.get("code");if(!code)return;
    const expectedState=sessionStorage.getItem("yukina_oauth_state");
    const returnedState=params.get("state");
    const verifier=sessionStorage.getItem("yukina_oauth_verifier");
    cleanUrl();
    if(!expectedState||!returnedState||returnedState!==expectedState||!verifier){
      status.textContent="A validação de segurança falhou. Clique para iniciar um novo login.";button.disabled=false;return;
    }
    button.disabled=true;status.textContent="Validando sua conta com o Discord…";
    try{
      const response=await fetch(API_BASE+"/api/oauth/token",{
        method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({code,code_verifier:verifier,redirect_uri:REDIRECT_URI})
      });
      const data=await response.json().catch(()=>({}));
      if(!response.ok||!data.access_token)throw new Error(data.detail||"A API não conseguiu concluir o login. Tente novamente.");
      localStorage.setItem("yukina_discord_token",data.access_token);
      if(data.refresh_token)localStorage.setItem("yukina_discord_refresh_token",data.refresh_token);
      localStorage.setItem("yukina_discord_token_expires_at",String(Date.now()+Math.max(60000,Number(data.expires_in||3600)*1000-60000)));
      localStorage.setItem("yukina_panel_session_expires_at",String(Date.now()+7*24*60*60*1000));
      sessionStorage.removeItem("yukina_oauth_verifier");sessionStorage.removeItem("yukina_oauth_state");
      status.textContent="Login concluído! Abrindo o painel…";
      location.replace("./configuracoes-servidor.html");
    }catch(e){
      sessionStorage.removeItem("yukina_oauth_verifier");sessionStorage.removeItem("yukina_oauth_state");
      status.textContent=e.message||"Não foi possível entrar. Tente novamente.";button.disabled=false;
    }
  }
  button.addEventListener("click",startLogin);
  finishLogin();
})();
</script>
</body>
</html>
