<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#10091d">
  <meta name="description" content="Yukina Daily">
  <title>Daily • Yukina</title>
  <link rel="icon" type="image/png" href="./assets/yukina-bg.png">
  <style>
    *{box-sizing:border-box}
    html,body{width:100%;min-height:100%;margin:0}
    body{min-height:100vh;min-height:100dvh;background:#10091d;color:#fff;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow-x:hidden;overflow-y:auto}
    .backdrop{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;z-index:-2;pointer-events:none}
    .shade{position:fixed;inset:0;background:rgba(13,6,24,.28);z-index:-1;pointer-events:none}
    .profile{position:fixed;top:20px;right:clamp(16px,3vw,38px);display:none;align-items:center;gap:11px;max-width:min(280px,calc(100vw - 32px));padding:8px 14px 8px 8px;border:1px solid rgba(255,192,229,.35);border-radius:999px;background:rgba(20,8,34,.68);box-shadow:0 8px 28px rgba(0,0,0,.2);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
    .profile.visible{display:flex}
    .welcome{position:relative;z-index:1;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(28px,5vh,52px);padding:110px 24px 42px;text-align:center}
    .welcome h1{max-width:1100px;min-height:1.04em;margin:0;color:#fff4fc;font-size:clamp(2.8rem,8.5vw,7.2rem);font-weight:900;line-height:1.04;letter-spacing:-.055em;text-wrap:balance;text-shadow:0 5px 28px rgba(0,0,0,.48),0 0 42px rgba(255,190,230,.22)}\n    .welcome h1::after{content:"";display:inline-block;width:3px;height:.82em;margin-left:7px;vertical-align:-.06em;background:#ffd8ef;box-shadow:0 0 14px rgba(255,190,230,.8);animation:caret-blink .75s steps(2,start) infinite}\n    .welcome h1.done::after{display:none}\n    @keyframes caret-blink{to{visibility:hidden}}
    .security-check{width:min(420px,100%);display:flex;flex-direction:column;align-items:center;gap:12px;padding:18px 16px;border:1px solid rgba(255,203,235,.3);border-radius:20px;background:rgba(20,8,34,.68);box-shadow:0 12px 34px rgba(0,0,0,.22);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
    .security-check p{margin:0;color:#fff0fb;font-size:14px;font-weight:650}
    #turnstileWidget{min-height:65px;display:flex;align-items:center;justify-content:center}
    .security-status{min-height:20px;color:#f8d9eb;font-size:13px}
    .daily-reel{width:min(900px,100%);display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(9px,2vw,18px);animation:welcome-in 1s .12s ease both}
    .reel-field{min-height:clamp(112px,17vw,158px);display:flex;align-items:center;justify-content:center;gap:clamp(3px,1vw,10px);padding:12px 8px;border:1px solid rgba(255,203,235,.36);border-radius:22px;background:linear-gradient(145deg,rgba(255,225,245,.16),rgba(28,10,45,.62));box-shadow:0 12px 34px rgba(0,0,0,.24),inset 0 1px rgba(255,255,255,.12);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
    .reel-field span{font-size:clamp(1.45rem,4vw,2.7rem);line-height:1;filter:drop-shadow(0 3px 8px rgba(0,0,0,.3))}
    .reel-field:nth-child(1){border-color:rgba(255,174,220,.48)}.reel-field:nth-child(2){border-color:rgba(190,222,255,.48)}.reel-field:nth-child(3){border-color:rgba(255,215,143,.48)}.reel-field:nth-child(4){border-color:rgba(255,190,190,.48)}
    @keyframes welcome-in{from{opacity:0;transform:translateY(18px) scale(.98)}to{opacity:1;transform:translateY(0) scale(1)}}
    @media(max-width:650px){.welcome{gap:30px;padding:100px 16px 30px}.welcome h1{font-size:clamp(2.7rem,12vw,4.4rem)}.daily-reel{grid-template-columns:repeat(2,minmax(0,1fr));max-width:440px}.reel-field{min-height:104px;border-radius:18px}.reel-field span{font-size:clamp(1.8rem,8vw,2.5rem)}}
    .profile img{width:38px;height:38px;flex:0 0 38px;border-radius:50%;object-fit:cover;border:1px solid rgba(255,192,229,.6)}
    .profile span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#fff0fb;font-size:14px;font-weight:700}
    @media(max-width:520px){.profile{top:14px;right:14px;padding:6px 11px 6px 6px;gap:8px}.profile img{width:34px;height:34px;flex-basis:34px}.profile span{font-size:13px}}
  </style>
</head>
<body>
  <img class="backdrop" src="./assets/yukina-bg.png" alt="" aria-hidden="true">
  <div class="shade" aria-hidden="true"></div>
  <main class="welcome">
    <h1>Que bom ter você por aqui!</h1>
    <section class="daily-reel" aria-label="Roleta Daily">
      <div class="reel-field" aria-label="Cerejeiras"><span>🌸</span><span>🌸</span><span>🌸</span><span>🌸</span></div>
      <div class="reel-field" aria-label="Flocos de neve"><span>❄️</span><span>❄️</span><span>❄️</span><span>❄️</span></div>
      <div class="reel-field" aria-label="Jackpot"><span>🎰</span><span>🎰</span><span>🎰</span><span>🎰</span></div>
      <div class="reel-field" aria-label="Portões Torii"><span>⛩️</span><span>⛩️</span><span>⛩️</span><span>⛩️</span></div>
    </section>
    <section class="security-check" aria-label="Verificação de segurança">
      <p>❄️ Antes de continuar, confirme que você é humano</p>
      <div id="turnstileWidget"></div>
      <span class="security-status" id="turnstileStatus" role="status">Carregando verificação...</span>
    </section>
  </main>
  <div class="profile" id="dailyProfile" aria-label="Usuário conectado">
    <img id="dailyAvatar" alt="">
    <span id="dailyName"></span>
  </div>
  <script>\n    (()=>{\n      const heading=document.querySelector(".welcome h1");\n      const message="Que bom ter você por aqui!";\n      heading.setAttribute("aria-label",message);\n      heading.textContent="";\n      let index=0;\n      const typeNext=()=>{\n        if(index<message.length){heading.textContent+=message.charAt(index++);setTimeout(typeNext,65)}\n        else heading.classList.add("done");\n      };\n      setTimeout(typeNext,350);\n    })();\n  </script>\n  <script src="./api-config.js"></script>
  <script>
    (() => {
      const status = document.getElementById("turnstileStatus");
      const widget = document.getElementById("turnstileWidget");
      const api = () => String(window.YUKINA_API_URL || "").replace(/\\/+$/, "");
      const setStatus = message => { status.textContent = message; };
      const loadTurnstile = async () => {
        try {
          const base = api();
          if (!base) throw new Error("API da Yukina não encontrada.");
          const response = await fetch(base + "/api/config/turnstile", { cache: "no-store" });
          const config = await response.json().catch(() => ({}));
          if (!response.ok || !config.siteKey) throw new Error("A chave pública da verificação não foi encontrada no servidor.");
          await new Promise((resolve, reject) => {
            if (window.turnstile) return resolve();
            const script = document.createElement("script");
            script.src = "https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit";
            script.async = true;
            script.defer = true;
            script.onload = resolve;
            script.onerror = () => reject(new Error("Não foi possível carregar a verificação."));
            document.head.appendChild(script);
          });
          window.turnstile.render(widget, {
            sitekey: config.siteKey,
            theme: "dark",
            callback: () => setStatus("Verificação concluída! ❄️"),
            "expired-callback": () => setStatus("A verificação expirou. Faça novamente."),
            "error-callback": () => setStatus("Não foi possível verificar. Tente novamente.")
          });
          setStatus("Conclua a verificação acima.");
        } catch (error) {
          setStatus(error.message || "Falha ao carregar a verificação.");
          console.warn("[Daily] Turnstile:", error);
        }
      };
      loadTurnstile();
    })();
  </script>
  <script>
    (async()=>{
      const profile=document.getElementById("dailyProfile");
      const avatar=document.getElementById("dailyAvatar");
      const name=document.getElementById("dailyName");
      const getStored=key=>{try{return localStorage.getItem(key)||""}catch(_){return""}};
      const setStored=(key,value)=>{try{localStorage.setItem(key,value)}catch(_){}};
      const apiUrl=()=>String(window.YUKINA_API_URL||"").replace(/\/+$/,"");
      const refresh=async()=>{
        const refreshToken=getStored("yukina_discord_refresh_token");
        const api=apiUrl();
        if(!refreshToken||!api)return "";
        try{
          const response=await fetch(api+"/api/oauth/refresh",{method:"POST",headers:{"Content-Type":"application/json",Accept:"application/json"},body:JSON.stringify({refresh_token:refreshToken}),cache:"no-store"});
          const data=await response.json().catch(()=>({}));
          if(!response.ok||!data.access_token)return "";
          setStored("yukina_discord_token",data.access_token);
          if(data.refresh_token)setStored("yukina_discord_refresh_token",data.refresh_token);
          if(data.expires_in)setStored("yukina_discord_token_expires_at",String(Date.now()+Math.max(60000,Number(data.expires_in)*1000-60000)));
          return data.access_token;
        }catch(_){return ""}
      };
      let access=getStored("yukina_discord_token");
      if(!access)access=await refresh();
      if(!access)return;
      let user=null;
      try{
        const api=apiUrl();
        if(api){
          let response=await fetch(api+"/api/oauth/me",{headers:{Authorization:"Bearer "+access,Accept:"application/json"},cache:"no-store"});
          if(response.status===401){
            access=await refresh();
            if(!access)throw new Error("Sessão inválida");
            response=await fetch(apiUrl()+"/api/oauth/me",{headers:{Authorization:"Bearer "+access,Accept:"application/json"},cache:"no-store"});
          }
          if(response.ok)user=await response.json();
        }
      }catch(_){}
      // Usa o endpoint oficial do Discord caso a API da Yukina não responda.
      if(!user||!user.id||!user.username){
        try{
          const response=await fetch("https://discord.com/api/users/@me",{headers:{Authorization:"Bearer "+access,Accept:"application/json"},cache:"no-store"});
          if(response.ok)user=await response.json();
        }catch(_){}
      }
      if(!user||!user.id||!user.username)return;
      const display=user.global_name||user.username;
      const picture=user.avatar
        ?"https://cdn.discordapp.com/avatars/"+encodeURIComponent(user.id)+"/"+encodeURIComponent(user.avatar)+(String(user.avatar).startsWith("a_")?".gif":".png")+"?size=128"
        :"https://cdn.discordapp.com/embed/avatars/"+(Number(user.discriminator||0)%5)+".png";
      avatar.onerror=()=>{avatar.onerror=null;avatar.src="https://cdn.discordapp.com/embed/avatars/0.png"};
      avatar.src=picture;
      avatar.alt="Foto de "+display;
      name.textContent=display;
      profile.classList.add("visible");
    })().catch(error=>console.warn("Não foi possível carregar o perfil do Daily:",error));
  </script>
</body>
</html>
