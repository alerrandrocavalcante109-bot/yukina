name: Deploy Yukina site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Build static site folder
        run: |
          mkdir -p _site
          for f in index.html login.html comandos.html configuracoes.html configuracoes-servidor.html daily.html sistemas.html vip.html vip-comprovante.html wiki.html api-config.js tema.js wiki-menu.js vip-menu.js CNAME googleb04baa779fbc794f.html; do
            [ -f "$f" ] && cp "$f" _site/
          done
          cp -r assets _site/assets 2>/dev/null || true
          if [ -f _site/index.html ]; then
            sed -i 's#</body>#<script src="./wiki-menu.js" defer></script><script src="./vip-menu.js" defer></script></body>#i' _site/index.html
          fi
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
