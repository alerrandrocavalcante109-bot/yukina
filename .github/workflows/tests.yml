name: Yukina tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  calculator-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install
      - name: Run automated tests
        run: npm test
